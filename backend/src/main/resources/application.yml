spring:
  application:
    name: hardware-pos
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5432/hardwarepos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping and
      # the migrations still agree, and fails fast at startup when they do not.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

pos:
  ai:
    # No key here on purpose. With POS_AI_ANTHROPIC_API_KEY unset, the property
    # is absent, the Claude parser is not created, and the rule-based parser
    # runs instead. Setting the environment variable switches Claude on.
    model: claude-sonnet-4-5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    za.co.ntsumo.pos: INFO
