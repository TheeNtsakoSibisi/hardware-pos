name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests against PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hardwarepos_test
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Unit tests, then integration tests against the real database. The
      # integration tests run the Flyway migrations, so a broken migration
      # fails the build rather than the first deployment.
      - name: Build and test
        working-directory: backend
        env:
          POS_TEST_DB_URL: jdbc:postgresql://localhost:5432/hardwarepos_test
          POS_TEST_DB_USER: pos
          POS_TEST_DB_PASSWORD: pos
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  seed:
    name: Demo seed is reproducible
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bcrypt
        run: pip install bcrypt

      # The seed migration is generated from the CSVs. If someone edits the
      # migration by hand, this job notices.
      - name: Regenerate and compare
        run: |
          python3 data/seed_generator.py
          git diff --exit-code backend/src/main/resources/db/migration/V2__demo_seed.sql
